# One-command production-style run of the API.
#   cp server/.env.example server/.env   # fill in real values
#   docker compose up -d --build
services:
  api:
    build: ./server
    restart: unless-stopped
    ports:
      - '${PORT:-4000}:4000'
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - server/.env
    volumes:
      # Persist the JSON data store across restarts.
      - api-data:/app/data
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  api-data:
